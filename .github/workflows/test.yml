# Installs sv with Scoop on Windows, from this checkout as the bucket, and runs a real check with it, as a person
# would. Run on every push and pull request, by hand, and weekly, so a release that no longer installs is seen.
name: test
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"
permissions:
  contents: read
  # To read this job's own check run, for the name the ruleset knows it by.
  checks: read
jobs:
  install:
    runs-on: windows-latest
    steps:
      # The "Protect main" ruleset requires this job by name, "install". Renamed, or split into a matrix (which adds
      # its values to the name), it would not be required, and a manifest that fails could still merge. So the job
      # reads its own name from its check run and fails when the rules for main do not require it.
      # What this misses: a job removed from here stays required and never reports, so pull requests wait on it.
      - name: This job is a required check on main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          if (-not $Env:CHECK_RUN_ID) { Write-Error "job.check_run_id is empty, so this job cannot look up its own name"; exit 1 }
          $headers = @{ Authorization = "Bearer $Env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $api = "https://api.github.com/repos/$Env:GITHUB_REPOSITORY"
          $name = (Invoke-RestMethod -Headers $headers "$api/check-runs/$Env:CHECK_RUN_ID").name
          $rules = Invoke-RestMethod -Headers $headers "$api/rules/branches/main"
          $required = @($rules | Where-Object type -eq "required_status_checks" |
            ForEach-Object { $_.parameters.required_status_checks.context })
          "This job: $name"
          "Required on main:"
          $required | ForEach-Object { "  $_" }
          if ($required -cnotcontains $name) {
            Write-Error "The job `"$name`" is not a required check on main, so a pull request could merge without it. Add it to the `"Protect main`" ruleset's required checks, or give the job back a name the ruleset requires."
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bucket-repo
      # Only StackVet's example apps, to give sv something to check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abbyshade111/StackVet
          path: stackvet
          sparse-checkout: examples
      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $Env:GITHUB_PATH
      # Scoop adds a bucket only from a git address, so the test installs from this checkout's manifest file itself,
      # which is what "scoop install stackvet/sv" reads once the bucket is added.
      - name: Install sv from this checkout's manifest
        shell: pwsh
        run: |
          scoop install "$Env:GITHUB_WORKSPACE\bucket-repo\bucket\sv.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: sv starts and checks an example app
        shell: pwsh
        run: |
          # In PowerShell "sv" is its own alias for Set-Variable, so the program is typed as sv.exe there.
          sv.exe --version
          if ($LASTEXITCODE -ne 0) { Write-Error "sv.exe --version exited $LASTEXITCODE"; exit 1 }
          # The second name, which PowerShell has no alias for.
          stackvet --version
          if ($LASTEXITCODE -ne 0) { Write-Error "stackvet --version exited $LASTEXITCODE"; exit 1 }
          sv.exe check stackvet\examples\flask-booking *> check.txt
          Get-Content check.txt -TotalCount 40
          if (-not (Select-String -Path check.txt -Pattern "Read " -Quiet)) { Write-Error "sv installed by Scoop did not read the example app"; exit 1 }
      - name: The manifest can follow the next release
        shell: pwsh
        run: |
          & "$(scoop prefix scoop)\bin\checkver.ps1" -App sv -Dir "$Env:GITHUB_WORKSPACE\bucket-repo\bucket"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The README's bucket address works
        shell: pwsh
        run: |
          scoop bucket add stackvet https://github.com/abbyshade111/scoop-stack-vet
          scoop info stackvet/sv
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # And in the older Command Prompt, which has no such alias, plain sv works.
          cmd /c "sv --version"
          if ($LASTEXITCODE -ne 0) { Write-Error "plain sv in the Command Prompt exited $LASTEXITCODE"; exit 1 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # ConfigVet's cv, from v0.3.0 (StackVet's backlog 0694), in this same job, so the one required check covers both
      # manifests. PowerShell has no command named cv (StackVet's release workflow checks that on every change to it).
      - name: Install cv from this checkout's manifest
        shell: pwsh
        run: |
          scoop install "$Env:GITHUB_WORKSPACE\bucket-repo\bucket\cv.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: cv starts and reads a Dockerfile
        shell: pwsh
        run: |
          cv --version
          if ($LASTEXITCODE -ne 0) { Write-Error "cv --version exited $LASTEXITCODE"; exit 1 }
          New-Item -ItemType Directory cv-app | Out-Null
          Set-Content -Path cv-app\Dockerfile -Value "FROM node:24-alpine`nCMD [`"node`", `"index.js`"]"
          # --no-tools: hadolint, Checkov, and Trivy are not on this runner; cv's own tests show each is said not run.
          cv check cv-app --no-tools --out cv-report *> cv-check.txt
          Get-Content cv-check.txt -TotalCount 40
          if (-not (Select-String -Path cv-check.txt -Pattern "Read 1 deployment files" -Quiet)) { Write-Error "cv installed by Scoop did not read the Dockerfile"; exit 1 }
          cmd /c "cv --version"
          if ($LASTEXITCODE -ne 0) { Write-Error "plain cv in the Command Prompt exited $LASTEXITCODE"; exit 1 }
      - name: cv's manifest can follow the next release
        shell: pwsh
        run: |
          & "$(scoop prefix scoop)\bin\checkver.ps1" -App cv -Dir "$Env:GITHUB_WORKSPACE\bucket-repo\bucket"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # AgentVet's av, from v0.3.1 (StackVet's backlog 0724), in this same job too. PowerShell has no command named av
      # (StackVet's release workflow checks that on every change to it).
      - name: Install av from this checkout's manifest
        shell: pwsh
        run: |
          scoop install "$Env:GITHUB_WORKSPACE\bucket-repo\bucket\av.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: av starts and reports on an empty folder
        shell: pwsh
        run: |
          av --version
          if ($LASTEXITCODE -ne 0) { Write-Error "av --version exited $LASTEXITCODE"; exit 1 }
          # A folder with nothing about a tool: av says what it did not look at, and exits 2.
          New-Item -ItemType Directory av-app | Out-Null
          av report av-app *> av-report.txt
          $code = $LASTEXITCODE
          Get-Content av-report.txt -TotalCount 40
          if ($code -ne 2) { Write-Error "av report of an empty folder exited $code, not 2"; exit 1 }
          if (-not (Select-String -Path av-report.txt -Pattern "Not looked at" -Quiet)) { Write-Error "av installed by Scoop did not say what it did not look at"; exit 1 }
          cmd /c "av --version"
          if ($LASTEXITCODE -ne 0) { Write-Error "plain av in the Command Prompt exited $LASTEXITCODE"; exit 1 }
      - name: av's manifest can follow the next release
        shell: pwsh
        run: |
          & "$(scoop prefix scoop)\bin\checkver.ps1" -App av -Dir "$Env:GITHUB_WORKSPACE\bucket-repo\bucket"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # What Scoop installed and where, and the program run without its shim, when anything above failed.
      - name: What was installed, when anything failed
        if: failure()
        shell: pwsh
        run: |
          scoop list
          Get-Command sv.exe -ErrorAction Continue | Format-List
          $dir = scoop prefix sv
          Get-ChildItem $dir | Select-Object Name, Length
          & "$dir\sv.exe" --version
          "sv.exe exited $LASTEXITCODE"
