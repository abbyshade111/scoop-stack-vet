# Installs sv with Scoop on Windows, from this checkout as the bucket, and runs a real check with it, as a person
# would. Run on every push and pull request, by hand, and weekly, so a release that no longer installs is seen.
name: test
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bucket-repo
      # Only StackVet's example apps, to give sv something to check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abbyshade111/StackVet
          path: stackvet
          sparse-checkout: examples
      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $Env:GITHUB_PATH
      # Scoop adds a bucket only from a git address, so the test installs from this checkout's manifest file itself,
      # which is what "scoop install stackvet/sv" reads once the bucket is added.
      - name: Install sv from this checkout's manifest
        shell: pwsh
        run: |
          scoop install "$Env:GITHUB_WORKSPACE\bucket-repo\bucket\sv.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: sv starts and checks an example app
        shell: pwsh
        run: |
          sv --version
          if ($LASTEXITCODE -ne 0) { Write-Error "sv --version exited $LASTEXITCODE"; exit 1 }
          sv check stackvet\examples\flask-booking *> check.txt
          Get-Content check.txt -TotalCount 40
          if (-not (Select-String -Path check.txt -Pattern "Read " -Quiet)) { Write-Error "sv installed by Scoop did not read the example app"; exit 1 }
      - name: The manifest can follow the next release
        shell: pwsh
        run: |
          & "$(scoop prefix scoop)\bin\checkver.ps1" -App sv -Dir "$Env:GITHUB_WORKSPACE\bucket-repo\bucket"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The README's bucket address works
        shell: pwsh
        run: |
          scoop bucket add stackvet https://github.com/abbyshade111/scoop-stack-vet
          scoop info stackvet/sv
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # What Scoop installed and where, and the program run without its shim, when anything above failed.
      - name: What was installed, when anything failed
        if: failure()
        shell: pwsh
        run: |
          scoop list
          Get-Command sv -ErrorAction Continue | Format-List
          $dir = scoop prefix sv
          Get-ChildItem $dir | Select-Object Name, Length
          Get-Content "$(Split-Path (Get-Command sv).Source)\sv.shim" -ErrorAction Continue
          & "$dir\sv.exe" --version
          "sv.exe exited $LASTEXITCODE"
